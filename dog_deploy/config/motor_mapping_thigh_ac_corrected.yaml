# TEMPORARY test copy of dog_description/config/motor_mapping.yaml.
#
# Sign history for this file:
#   - Motors 1, 5 (leg_a/leg_c THIGH) flipped +1 -> -1 first, from bench
#     testing (preset_pose.yaml's working `standing` preset + the real
#     range-of-motion "halfway" test both disagreed with dog.mjcf.xml's
#     CAD-derived sim kinematics for these two specifically).
#   - Motors 2, 6 (leg_a/leg_c CALF) flipped +1 -> -1 next (2026-07-25),
#     from directly watching `policy_node` run v4 on the real robot --
#     user observed motors 1, 2, 5, 6 all moving the wrong direction.
#     Notably this is the SAME two legs (a, c) as the thigh issue --
#     both of that leg's joints affected, not just the thigh.
#   - Motors 3, 4, 7, 8 (legs b/d, both joints) are UNCHANGED (still -1,
#     matching the original file) -- nothing so far suggests those are
#     wrong; leave them alone unless real testing says otherwise.
#
# Worth noticing: every motor above now happens to be -1. If a future
# test suggests legs b/d need flipping too, that would mean the entire
# mapping just needs uniform inversion, which would point at a simpler,
# more systematic root cause than four independent per-leg sign errors --
# worth checking for at that point rather than continuing to patch one
# leg at a time.
#
# NOT a replacement for dog_description/config/motor_mapping.yaml -- that
# file remains the canonical source of truth for training and everything
# else. This copy exists only so policy_node's `motor_mapping_path`
# --ros-args override can point at it for this test:
#   ros2 run dog_deploy policy_node --ros-args -p motor_mapping_path:=$(ros2 pkg prefix dog_deploy)/share/dog_deploy/config/motor_mapping_thigh_ac_corrected.yaml -p dry_run_hold_pose:=false -p policy_path:=... -p max_delta_deg_per_step:=2.0
#
# STILL UNRESOLVED, NOT FIXED BY THIS FILE: the calf magnitude problem.
# v4's calf outputs will still likely command roughly +-90-99deg in
# magnitude, which real bench testing showed is close to what physically
# collides the calf into the thigh (the real standing calf angle is
# closer to 0-27deg, per the leg_a sweep test) -- flipping the sign
# doesn't change the magnitude. Watch the calves closely regardless.
legs:
  leg_a: front_right
  leg_b: front_left
  leg_c: back_right
  leg_d: back_left

motors:
  1:
    leg: leg_a
    joint: thigh
    sign: -1   # flipped from +1, see header
  2:
    leg: leg_a
    joint: calf
    sign: -1   # flipped from +1, see header
  3:
    leg: leg_b
    joint: calf
    sign: -1
  4:
    leg: leg_b
    joint: thigh
    sign: -1
  5:
    leg: leg_c
    joint: thigh
    sign: -1   # flipped from +1, see header
  6:
    leg: leg_c
    joint: calf
    sign: -1   # flipped from +1, see header
  7:
    leg: leg_d
    joint: calf
    sign: -1
  8:
    leg: leg_d
    joint: thigh
    sign: -1
