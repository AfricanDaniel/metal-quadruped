# Canonical motor_id -> leg/joint mapping for the 8-DOF dog (no hip motors).
#
# Both dog_gym (simulation) and dog_deploy (real-hardware bridge) load this
# file so action ordering and sign conventions can never drift out of sync
# between the two. Do not duplicate/hardcode this mapping anywhere else.
#
# Convention:
#   - `sign` says whether that motor's real firmware "increase commanded
#     degrees" direction matches dog.mjcf.xml's own sim-native joint
#     convention (sign: 1) or is inverted relative to it (sign: -1).
#     dog_deploy multiplies the policy's per-motor output by `sign`
#     before sending it to actuator/SetMotorTargets, and multiplies a
#     motor's real reading by `sign` before treating it as a
#     sim-convention angle.
#   - IMPORTANT (corrected 2026-07-26, see generate_dog_mjcf.py's
#     JOINT_RANGE_OVERRIDES_DEG comment and daniel_cl_context.md for the
#     full saga): dog.mjcf.xml's thigh joints are NOT actually uniform
#     across all 4 legs -- an earlier version of this comment claimed
#     "positive = away from front, same physical meaning for all four
#     legs," which is FALSE for leg_a/leg_c specifically (confirmed by
#     direct forward-kinematics: sweeping each thigh's qpos and reading
#     the resulting foot height shows leg_a/leg_c extend toward standing
#     at NEGATIVE qpos, leg_b/leg_d at POSITIVE -- a genuine, real,
#     mirrored CAD-axis asymmetry between the two sides, not a bug).
#     `sign` below is per-motor precisely because of this -- don't assume
#     symmetry between sides when reasoning about what a given sign value
#     "should" be for a leg you haven't independently checked.
#   - Determined most reliably via an isolated single-motor real-hardware
#     test (send a known raw delta to ONE motor, no policy, watch which
#     way it physically swings) cross-checked against direct sim
#     forward-kinematics (does that same qpos direction actually lower
#     the foot toward the ground) -- NOT by comparing against another
#     sim-only reference (STANDING_QPOS_DEG, preset_pose.yaml) alone,
#     which is what led this project down a wrong turn earlier.
#
# leg_a/b/c/d are internal names (also used as dog.mjcf.xml body/joint name
# prefixes, e.g. "leg_a_thigh") -- their physical corners are confirmed
# below in `legs:`.
legs:
  leg_a: front_right
  leg_b: front_left
  leg_c: back_right
  leg_d: back_left

motors:
  1:
    leg: leg_a
    joint: thigh
    sign: -1
  2:
    leg: leg_a
    joint: calf
    sign: 1
  3:
    leg: leg_b
    joint: calf
    sign: -1
  4:
    leg: leg_b
    joint: thigh
    sign: -1
  5:
    leg: leg_c
    joint: thigh
    sign: -1
  6:
    leg: leg_c
    joint: calf
    sign: 1
  7:
    leg: leg_d
    joint: calf
    sign: -1
  8:
    leg: leg_d
    joint: thigh
    sign: -1
