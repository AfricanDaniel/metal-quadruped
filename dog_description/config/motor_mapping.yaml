# Canonical motor_id -> leg/joint mapping for the 8-DOF dog (no hip motors).
#
# Both dog_gym (simulation) and dog_deploy (real-hardware bridge) load this
# file so action ordering and sign conventions can never drift out of sync
# between the two. Do not duplicate/hardcode this mapping anywhere else.
#
# Convention:
#   - `sign` says whether that motor's real firmware "increase commanded
#     degrees" direction matches dog.mjcf.xml's own sim-native joint
#     convention (sign: 1) or is inverted relative to it (sign: -1).
#     dog_deploy multiplies the policy's per-motor output by `sign`
#     before sending it to actuator/SetMotorTargets, and multiplies a
#     motor's real reading by `sign` before treating it as a
#     sim-convention angle.
#   - ALL 8 SIGNS ARE +1 SINCE 2026-07-26, BY CONSTRUCTION: sim's own
#     joint axes were deliberately flipped in generate_dog_mjcf.py
#     (AXIS_FLIP -- user decision, formerly TODO item 12 in
#     daniel_cl_context.md) so that every joint's raw sim direction
#     matches the real motor's direction 1:1, motor for motor. The
#     per-joint set of flips was derived by measuring BOTH sides
#     independently: the user's real bench table (which way each real
#     motor moves its link for increasing theta) against a direct
#     forward-kinematics sweep of each sim joint (d(foot_y)/d(theta),
#     +y = front in the CAD frame) -- the two disagreed on exactly 6 of
#     8 joints (motors 1, 2, 4, 5, 7, 8), and those 6 axes were negated.
#     `python3 -m mujoco.viewer --mjcf=dog.mjcf.xml` therefore now shows
#     real-life directions directly.
#   - The sim axes are still NOT uniform leg-to-leg (real hardware
#     mounts left/right motors as mirror images, and sim now mirrors
#     that faithfully): "away from front" is INCREASING theta for the
#     right legs' thighs (motors 1, 5) but DECREASING for the left
#     legs' (motors 4, 8); "towards front" is INCREASING theta for the
#     right legs' calves (motors 2, 6) but DECREASING for the left
#     legs' (motors 3, 7). Same as the real robot -- that's the point.
#   - If a future CAD re-export or motor re-mount changes any direction:
#     re-measure BOTH sides per motor (real: isolated single-motor
#     delta, no policy; sim: FK d(foot_y)/d(theta) sweep) before
#     touching sign or AXIS_FLIP -- never infer from a documented
#     convention or by comparing two sim-only references, which is what
#     caused this project's long sign saga (see daniel_cl_context.md).
#
# leg_a/b/c/d are internal names (also used as dog.mjcf.xml body/joint name
# prefixes, e.g. "leg_a_thigh") -- their physical corners are confirmed
# below in `legs:`.
legs:
  leg_a: front_right
  leg_b: front_left
  leg_c: back_right
  leg_d: back_left

motors:
  1:
    leg: leg_a
    joint: thigh
    sign: 1
  2:
    leg: leg_a
    joint: calf
    sign: 1
  3:
    leg: leg_b
    joint: calf
    sign: 1
  4:
    leg: leg_b
    joint: thigh
    sign: 1
  5:
    leg: leg_c
    joint: thigh
    sign: 1
  6:
    leg: leg_c
    joint: calf
    sign: 1
  7:
    leg: leg_d
    joint: calf
    sign: 1
  8:
    leg: leg_d
    joint: thigh
    sign: 1
